name: serum_mobile
description: "Serum Mobile - Herramienta móvil ejecutiva y de supervisión médica del ecosistema Serum LIS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Lógica de negocio y repositorios centrales
  serum_business:
    path: ../serum_business

  # Manejo de Estado y Arquitectura Reactiva
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0

  # Enrutamiento Adaptativo
  go_router: ^18.1.0

  # Almacenamiento Local Seguro (Hive CE)
  hive_ce: ^2.1.2
  hive_ce_flutter: ^2.5.0

  # UI, Iconos, Gráficos y Utilidades
  intl: ^0.20.3
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  google_fonts: ^8.2.1
  cached_network_image: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
